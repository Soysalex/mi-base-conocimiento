<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Visitas - Mi Base de Conocimiento</title>
    
    <!-- Script para el manejo del cambio de temas -->
    <script>
        function cambiarTema(tema) {
            document.documentElement.classList.remove('theme-fallout', 'theme-cyberpunk');
            if (tema !== 'default') {
                document.documentElement.classList.add('theme-' + tema);
            }
            localStorage.setItem('user-theme', tema);
        }
        
        (function() {
            const temaGuardado = localStorage.getItem('user-theme') || 'default';
            if (temaGuardado !== 'default') {
                document.documentElement.classList.add('theme-' + temaGuardado);
            }
            window.addEventListener('DOMContentLoaded', () => {
                const selector = document.getElementById('theme-selector');
                if (selector) selector.value = temaGuardado;
            });
        })();
    </script>

    <style>
        /* Variables y Configuración Global (Base + Temas) */
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-primary: #ededed;
            --text-secondary: #a1a1a1;
            --border-color: #262626;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            --accent-hover: #404040;
            --accent-color: #3b82f6;
        }

        html.theme-fallout {
            --bg-color: #050f05;
            --card-bg: #0c1c0c;
            --text-primary: #33ff33;
            --text-secondary: #1ea746;
            --border-color: #1b4d1b;
            --accent-hover: #22c55e;
            --accent-color: #10b981;
        }

        html.theme-cyberpunk {
            --bg-color: #080314;
            --card-bg: #14082c;
            --text-primary: #00f0ff;
            --text-secondary: #c77dff;
            --border-color: #ff007f;
            --accent-hover: #ff007f;
            --accent-color: #ff007f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Contenedor principal para centrar contenido */
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Cabecera fija y minimalista */
        .site-header {
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem 0;
            background-color: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .site-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .logo a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .logo a:hover {
            color: var(--text-primary);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        /* Selector de temas personalizado */
        .select-custom {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Sección Principal */
        .main-content {
            flex: 1;
            padding-top: 4rem;
            padding-bottom: 4rem;
        }

        .hero {
            margin-bottom: 3rem;
        }

        .hero h2 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        /* Tarjeta del contador */
        .counter-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .counter-card h3 {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .counter-number {
            font-size: 4rem;
            font-weight: 800;
            color: var(--accent-color);
            margin: 1rem 0;
            font-family: monospace;
        }

        .counter-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Pie de página */
        .site-footer {
            border-top: 1px solid var(--border-color);
            padding: 2rem 0;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <!-- Cabecera de la página -->
    <header class="site-header">
        <div class="container">
            <h1 class="logo"><a href="index.html">Knowledge Base</a> / Contador</h1>
            <nav class="nav-links">
                <a href="index.html">Inicio</a>
                
                <!-- Selector de Temas -->
                <select id="theme-selector" onchange="cambiarTema(this.value)" class="select-custom">
                    <option value="default">✨ Base (Actual)</option>
                    <option value="fallout">🟢 Fallout</option>
                    <option value="cyberpunk">🟣 Cyberpunk</option>
                </select>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-content container">
        <section class="hero" style="text-align: center;">
            <h2>Métrica de Visitas</h2>
            <p>Control global de accesos en tiempo real mediante servicios en la nube.</p>
        </section>

        <!-- Bloque central del Contador -->
        <section>
            <div class="counter-card">
                <h3>Visitas Totales Registradas</h3>
                <div id="contador-visitas" class="counter-number">...</div>
                <p>Este número se actualiza automáticamente cada vez que un usuario accede al sitio web.</p>
            </div>
        </section>
    </main>

    <!-- Pie de página -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 - Mi Base de Conocimiento</p>
        </div>
    </footer>

    <!-- Script JavaScript para consumir el contador global -->
    <script>
        fetch('https://api.countapi.xyz/hit/soysalex.github.io/mi-base-conocimiento')
            .then(response => response.json())
            .then(data => {
                document.getElementById('contador-visitas').textContent = data.value;
            })
            .catch(error => {
                document.getElementById('contador-visitas').textContent = "N/D";
                console.error("Error al conectar con la API del contador:", error);
            });
    </script>
</body>
</html>
